<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OCPP Central Server Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .content {
            padding: 30px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-card h3 {
            font-size: 2em;
            margin-bottom: 5px;
        }

        .stat-card p {
            opacity: 0.9;
        }

        .charge-points {
            margin-bottom: 30px;
        }

        .section-title {
            font-size: 1.8em;
            margin-bottom: 20px;
            color: #2c3e50;
            border-bottom: 3px solid #3498db;
            padding-bottom: 10px;
        }

        .charge-point-card {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .charge-point-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .charge-point-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .charge-point-id {
            font-size: 1.3em;
            font-weight: bold;
            color: #2c3e50;
        }

        .status-badge {
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: bold;
            text-transform: uppercase;
        }

        .status-available { background: #d4edda; color: #155724; }
        .status-preparing { background: #fff3cd; color: #856404; }
        .status-charging { background: #cce5ff; color: #004085; }
        .status-suspended { background: #f8d7da; color: #721c24; }
        .status-finishing { background: #e2e3e5; color: #383d41; }
        .status-reserved { background: #d1ecf1; color: #0c5460; }
        .status-unavailable { background: #f5c6cb; color: #721c24; }
        .status-faulted { background: #f8d7da; color: #721c24; }

        .charge-point-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }

        .detail-item {
            display: flex;
            flex-direction: column;
        }

        .detail-label {
            font-size: 0.9em;
            color: #6c757d;
            margin-bottom: 5px;
        }

        .detail-value {
            font-weight: bold;
            color: #2c3e50;
        }

        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9em;
            font-weight: bold;
            transition: all 0.2s;
        }

        .btn-primary { background: #007bff; color: white; }
        .btn-success { background: #28a745; color: white; }
        .btn-warning { background: #ffc107; color: #212529; }
        .btn-danger { background: #dc3545; color: white; }

        .btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 3px 10px rgba(0,0,0,0.2);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .no-charge-points {
            text-align: center;
            padding: 40px;
            color: #6c757d;
            font-size: 1.2em;
        }

        .refresh-btn {
            background: #17a2b8;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            margin-bottom: 20px;
        }

        .refresh-btn:hover {
            background: #138496;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #6c757d;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        .success {
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔌 OCPP Central Server Demo</h1>
            <p>Open Charge Point Protocol Central System Management</p>
        </div>

        <div class="content">
            <div class="stats">
                <div class="stat-card">
                    <h3 id="total-charge-points">0</h3>
                    <p>Total Charge Points</p>
                </div>
                <div class="stat-card">
                    <h3 id="available-charge-points">0</h3>
                    <p>Available</p>
                </div>
                <div class="stat-card">
                    <h3 id="charging-charge-points">0</h3>
                    <p>Charging</p>
                </div>
                <div class="stat-card">
                    <h3 id="faulted-charge-points">0</h3>
                    <p>Faulted</p>
                </div>
            </div>

            <button class="refresh-btn" onclick="loadChargePoints()">🔄 Refresh</button>

            <div id="message-area"></div>

            <div class="charge-points">
                <h2 class="section-title">Connected Charge Points</h2>
                <div id="charge-points-list">
                    <div class="loading">Loading charge points...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let chargePoints = [];

        function showMessage(message, type = 'success') {
            const messageArea = document.getElementById('message-area');
            const messageDiv = document.createElement('div');
            messageDiv.className = type;
            messageDiv.textContent = message;
            messageArea.appendChild(messageDiv);
            
            setTimeout(() => {
                messageDiv.remove();
            }, 5000);
        }

        function loadChargePoints() {
            fetch('/api/chargepoints')
                .then(response => response.json())
                .then(data => {
                    chargePoints = data;
                    updateStats();
                    renderChargePoints();
                })
                .catch(error => {
                    console.error('Error loading charge points:', error);
                    showMessage('Error loading charge points', 'error');
                });
        }

        function updateStats() {
            const total = chargePoints.length;
            const available = chargePoints.filter(cp => cp.status === 'Available').length;
            const charging = chargePoints.filter(cp => cp.status === 'Charging').length;
            const faulted = chargePoints.filter(cp => cp.status === 'Faulted').length;

            document.getElementById('total-charge-points').textContent = total;
            document.getElementById('available-charge-points').textContent = available;
            document.getElementById('charging-charge-points').textContent = charging;
            document.getElementById('faulted-charge-points').textContent = faulted;
        }

        function renderChargePoints() {
            const container = document.getElementById('charge-points-list');
            
            if (chargePoints.length === 0) {
                container.innerHTML = '<div class="no-charge-points">No charge points connected. Start the demo client to see charge points here.</div>';
                return;
            }

            container.innerHTML = chargePoints.map(cp => `
                <div class="charge-point-card">
                    <div class="charge-point-header">
                        <div class="charge-point-id">${cp.id}</div>
                        <div class="status-badge status-${cp.status.toLowerCase()}">${cp.status}</div>
                    </div>
                    
                    <div class="charge-point-details">
                        <div class="detail-item">
                            <div class="detail-label">Vendor</div>
                            <div class="detail-value">${cp.vendor || 'Unknown'}</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Model</div>
                            <div class="detail-value">${cp.model || 'Unknown'}</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Serial Number</div>
                            <div class="detail-value">${cp.serialNumber || 'Unknown'}</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Firmware</div>
                            <div class="detail-value">${cp.firmwareVersion || 'Unknown'}</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Last Seen</div>
                            <div class="detail-value">${new Date(cp.lastSeen).toLocaleString()}</div>
                        </div>
                    </div>
                    
                    <div class="actions">
                        <button class="btn btn-success" onclick="remoteStartTransaction('${cp.id}')" 
                                ${cp.status !== 'Available' ? 'disabled' : ''}>
                            ▶️ Start Transaction
                        </button>
                        <button class="btn btn-danger" onclick="remoteStopTransaction('${cp.id}')"
                                ${cp.status !== 'Charging' ? 'disabled' : ''}>
                            ⏹️ Stop Transaction
                        </button>
                        <button class="btn btn-warning" onclick="changeConfiguration('${cp.id}')">
                            ⚙️ Change Config
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function remoteStartTransaction(chargePointId) {
            const connectorId = prompt('Enter connector ID (default: 1):') || '1';
            const idTag = prompt('Enter ID tag (default: DEMO_TAG):') || 'DEMO_TAG';

            fetch(`/api/chargepoints/${chargePointId}/remote-start`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ connectorId: parseInt(connectorId), idTag })
            })
            .then(response => response.json())
            .then(data => {
                showMessage('Remote start transaction sent successfully');
                setTimeout(loadChargePoints, 1000);
            })
            .catch(error => {
                console.error('Error:', error);
                showMessage('Error sending remote start transaction', 'error');
            });
        }

        function remoteStopTransaction(chargePointId) {
            const transactionId = prompt('Enter transaction ID:');
            if (!transactionId) return;

            fetch(`/api/chargepoints/${chargePointId}/remote-stop`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ transactionId: parseInt(transactionId) })
            })
            .then(response => response.json())
            .then(data => {
                showMessage('Remote stop transaction sent successfully');
                setTimeout(loadChargePoints, 1000);
            })
            .catch(error => {
                console.error('Error:', error);
                showMessage('Error sending remote stop transaction', 'error');
            });
        }

        function changeConfiguration(chargePointId) {
            const key = prompt('Enter configuration key:');
            if (!key) return;
            
            const value = prompt('Enter configuration value:');
            if (!value) return;

            fetch(`/api/chargepoints/${chargePointId}/change-configuration`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ key, value })
            })
            .then(response => response.json())
            .then(data => {
                showMessage('Configuration change sent successfully');
            })
            .catch(error => {
                console.error('Error:', error);
                showMessage('Error sending configuration change', 'error');
            });
        }

        // Load charge points on page load
        loadChargePoints();
        
        // Auto-refresh every 10 seconds
        setInterval(loadChargePoints, 10000);
    </script>
</body>
</html>
